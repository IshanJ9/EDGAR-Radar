# Client authentication for the primary `postgres` service (Phase 7, step 2).
# Mounted by docker-compose.yml and selected with `-c hba_file=...`.
#
# The first seven rules are byte-for-byte the defaults the official
# postgres:16-alpine image generates on first start - checked by starting a
# throwaway container and reading its generated pg_hba.conf. The only
# addition is the last line.
#
# Why a mounted file rather than an init script: scripts in
# /docker-entrypoint-initdb.d/ run only when the data directory is empty, so
# they would never reach an existing volume - production's included. A
# mounted file applies to new and existing volumes alike.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256

# Added: lets `postgres-replica` stream WAL. The keyword `all` in the
# DATABASE column above does not cover replication connections, which is why
# this needs its own line. Same scope and method as the rule above it - a
# password is required, and only a role with the REPLICATION attribute can use
# it - so it does not widen who can connect.
host    replication     all             all                     scram-sha-256

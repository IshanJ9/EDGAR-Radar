name: CI

# Phase 6, steps 7 and 9.
#
# Step 7 added the four test jobs, triggered on every PR. Step 9 adds the
# `deploy` job and, with it, a second trigger: pushes to `Main`. Both triggers
# run the same four checks, which is the point - the deploy job `needs` all
# four, so the exact same suite that gates a PR also gates production.
#
# Why `push` rather than a separate deploy workflow: ROADMAP.md's Phase 6
# failure case is "a deploy with a broken migration fails the pipeline before
# reaching prod." Keeping deploy in this workflow, gated on `test-integration`,
# is what actually satisfies that. `scripts/runIntegrationTests.ts` runs the
# real `node-pg-migrate up` against a throwaway Postgres (Phase 6 step 4), so a
# broken migration fails CI on a disposable database and the deploy job never
# starts - the failure happens *before* prod, not during it.
#
# The four test jobs still need zero secrets, so fork PRs run the full suite.
# The deploy job does need secrets, which is unavoidable, but it only ever runs
# on `push` to `Main` - and forks cannot push - so fork PRs can never reach it.
on:
  pull_request:
  push:
    branches: [Main]

# Cancel superseded runs on pull requests, where only the latest commit
# matters. Never cancel a `Main` run: cancelling mid-deploy could leave the
# stack half-rebuilt, which is worse than letting a redundant deploy finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration

  deploy:
    # Every check must pass first. This is the "a failing-test PR can't reach
    # prod" guarantee expressed as a dependency rather than as a convention.
    needs: [lint, test, build, test-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest

    # A second, deploy-specific concurrency group so two rapid merges queue
    # rather than run `docker compose up` against the same host simultaneously.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # Written with `install -m 600 /dev/null` first so the key file never
      # exists world-readable, even momentarily - ssh refuses an over-permissive
      # key anyway, but creating it private from the start is the safer order.
      #
      # DEPLOY_HOST_KEY pins the server's SSH host key instead of using
      # StrictHostKeyChecking=no. Disabling host key checking would mean the
      # deploy authenticates itself to whatever answers on that IP, which is
      # exactly backwards for a job holding a private key.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" >> ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # `git fetch --depth 1` + `reset --hard FETCH_HEAD` rather than `git pull`:
      # the VM's clone is shallow, and reset handles a force-push to Main
      # without leaving the working tree in a conflicted state. It also leaves
      # untracked files alone, which matters - `.env` and the deployment-only
      # `docker-compose.override.yml` live on the VM and are not in the repo.
      #
      # `docker image prune -f` stops superseded image layers accumulating on a
      # 50GB boot volume across many deploys.
      - name: Deploy to Oracle Cloud VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              ubuntu@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/EDGAR-Radar
          git fetch --depth 1 origin Main
          git reset --hard FETCH_HEAD
          docker compose build
          docker compose up -d
          docker image prune -f
          echo "----- deployed revision -----"
          git log --oneline -1
          REMOTE

      # A deploy that isn't verified isn't finished. This asks the *public*
      # URL, so it proves the whole path end to end - host firewall, cloud
      # security list, Express, and Postgres - rather than only that a
      # container process started.
      #
      # Apple (CIK 0000320193) is already ingested, so this is served from
      # Postgres and does not call SEC. That matters because CLAUDE.md forbids
      # automated jobs hitting the real SEC API.
      #
      # The retry loop exists because `docker compose up -d` returns as soon as
      # containers are created, while the API still needs a moment to bind.
      - name: Smoke check the live deployment
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "http://${{ secrets.DEPLOY_HOST }}:3000/companies/0000320193" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Deployment verified."
              exit 0
            fi
            sleep 10
          done
          echo "Smoke check never returned 200 - deployment is not healthy."
          exit 1

# Wires the API, the three Phase 4 BullMQ workers, and the three Phase 3 jobs
# (poller, reconciliation, heartbeat) to Postgres and Redis.
#
# The Phase 3 jobs were left out until post-Phase 7, step 2: they resolved
# `data/company-universe.json` via `path.join(__dirname, ...)`, which breaks
# once compiled, so production ran without them and never discovered a new
# filing on its own. src/universe.ts fixed the path; see PROGRESS.md.
#
# Restart policies: every long-running service below uses
# `restart: unless-stopped`, so a crashed container, a Docker daemon restart,
# or a host reboot brings the stack back on its own, while a deliberate
# `docker compose stop` is still respected. This was previously set only in
# the production VM's uncommitted docker-compose.override.yml, so a fresh
# deployment would not have had it. Its absence is what turned Phase 3's
# real-world 48h run into a failure: a Postgres restart during an unattended
# OS update crashed the poller, and nothing brought it back for 3.5 days (see
# PROGRESS.md). The one-shot `migrate` job stays `restart: "no"`.
#
# SEC request budget: SEC allows 10 requests per second from this host, and
# several services call it. Each one that does sets SEC_REQUESTS_PER_SECOND,
# its share of that budget, and src/sec.ts gives every process a burst of 1.
# A process can then send at most (rate + 1) requests in any one-second
# window, so the sum of (rate + 1) over these services must stay at or under
# 10 - src/__tests__/secBudget.test.ts reads this file and fails if it does
# not. Current shares: api 1, worker-parser 2, poller 2, reconcile 1 -
# 6 per second sustained, at most 10 in any one second.
#
# No top-level `version:` key - obsolete in current Compose (v5.3.1 here).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Compose-only credentials for this container, independent of the
      # DATABASE_URL in .env used for host-based (non-Docker) `npm run dev`.
      # That DATABASE_URL points at `localhost`, which is meaningless inside
      # Compose's own network - services below construct their own
      # DATABASE_URL from these same three values, so nothing can drift
      # between what Postgres is configured with and what the app connects
      # with. Defaults match .env.example verbatim, so a clean checkout with
      # only `.env.example` copied boots correctly with zero edits.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-edgar_radar}
    # Phase 7, step 2 - two changes so `postgres-replica` can stream from this
    # server. The image's defaults already enable replication (wal_level =
    # replica, 10 WAL senders), checked against a throwaway container.
    # - hba_file: the stock rules plus one line admitting replication
    #   connections; see docker/postgres/pg_hba.conf.
    # - max_slot_wal_keep_size: a replication slot makes the primary keep WAL
    #   until the replica has received it, and the default (-1) keeps it
    #   without limit - so a replica that stayed down would eventually fill
    #   this disk and take the primary with it. Capped at 1GB, the slot is
    #   invalidated instead and only the replica needs rebuilding (delete its
    #   volume; see docker/postgres/replica-entrypoint.sh).
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_slot_wal_keep_size=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edgar_radar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Exposed to the host so `psql`/a GUI client can inspect the data
      # directly during development - not required by any composed service.
      - "5432:5432"

  # Phase 7, step 2: a streaming-replication hot standby of `postgres`, used by
  # the API for read-heavy endpoints (READ_DATABASE_URL below; routing in
  # src/db.ts and src/routes/companies.ts).
  #
  # On the same host as the primary by design: the only free compute left on
  # this project's Oracle Always Free allowance is a 1/8-OCPU, 1 GB Micro VM.
  # So this adds no read capacity - both servers share the same CPUs - and it
  # exists to build and measure the replication and routing mechanics. Moving
  # it to its own host later changes only the connection strings. See
  # PROGRESS.md.
  #
  # Deliberately optional to the rest of the stack: nothing lists it in
  # depends_on, and the API falls back to the primary for any read the replica
  # cannot serve. A broken replica should cost read offloading, not uptime.
  #
  # No `ports:` on purpose. The base file publishes the primary on all
  # interfaces for local development, and production has to override that
  # (its docker-compose.override.yml binds it to 127.0.0.1). A second
  # published database would need the same override, and forgetting it would
  # put a database on the public internet. Inspect it with
  # `docker compose exec postgres-replica psql -U postgres` instead.
  postgres-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    # Run with `sh` rather than executing the file, so it does not depend on
    # the execute bit surviving a Windows checkout.
    entrypoint: ["sh", "/docker/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      # Replicates as the same superuser the app already connects with, so
      # this grants nothing the stack does not already hold. A dedicated role
      # with only REPLICATION is the stricter choice once the replica runs on
      # a host of its own.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-edgar_radar}
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/docker/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Healthy means accepting connections and actually in standby mode - a
      # replica that had been promoted, or cloned wrongly, would pass
      # pg_isready alone.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edgar_radar} && [ \"$$(psql -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edgar_radar} -tAc 'select pg_is_in_recovery()')\" = t ]"]
      interval: 5s
      timeout: 5s
      retries: 10
      # The first start clones the whole database before it can answer.
      start_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ explicitly requires Redis to run with no key-eviction policy -
    # under memory pressure an eviction policy can silently drop queued job
    # data, which is a correctness issue for exactly the kind of at-least-
    # once delivery guarantees Phase 4 was built (and failure-case tested) to
    # provide. `noeviction` makes Redis return an error instead of dropping
    # data if it ever runs out of memory, which is the correct failure mode
    # for a queue backend.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 7, step 3: the response cache for the API's hot read endpoints (see
  # src/cache.ts). A separate server from `redis` above on purpose: a cache
  # must evict when full (allkeys-lru drops the least recently used entries),
  # while the queue Redis must never evict (`noeviction`, above). One Redis has
  # one policy, so they cannot share a server.
  # - maxmemory 64mb: a hard ceiling on this box's memory. At today's scale the
  #   whole working set is a few MB, so nothing is evicted in practice.
  # - no persistence (`--save ""`, no AOF): a cache is rebuilt from Postgres on
  #   demand, so writing it to disk would only cost I/O. A restart empties it,
  #   which is correct.
  # Nothing depends on it and it has no published port, for the same reasons
  # as `postgres-replica`: the API treats an unreachable cache as a miss.
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edgar_radar}
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot job, not a long-running service - never auto-restart it.
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # `runtime`'s default CMD (dist/src/server.js) - the API needs no
    # override, unlike the three workers below.
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edgar_radar}
      # Phase 7, step 2: read-heavy endpoints try this first and fall back to
      # DATABASE_URL (src/db.ts). Only the API gets it - the workers write, and
      # read back what they just wrote, so they stay on the primary.
      READ_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-replica:5432/${POSTGRES_DB:-edgar_radar}
      REDIS_URL: redis://redis:6379
      # Phase 7, step 3: the response cache (`redis-cache`), not the queue Redis.
      CACHE_REDIS_URL: redis://redis-cache:6379
      # Its share of the SEC budget (see the top of this file). The API only
      # calls SEC for a company it has never stored, or for a risk-factor
      # diff's filing text, so 1 per second is plenty.
      SEC_REQUESTS_PER_SECOND: "1"
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL}
      JWT_SECRET: ${JWT_SECRET}
      # Off unless explicitly enabled - see .env.example and src/app.ts. The
      # `:-` default matters: without it, an unset ENABLE_BULL_BOARD would
      # make Compose warn on every `up`, and the safe state would depend on
      # the variable being present rather than on it being absent.
      ENABLE_BULL_BOARD: ${ENABLE_BULL_BOARD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-parser:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/scripts/parserWorker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edgar_radar}
      REDIS_URL: redis://redis:6379
      # Phase 7, step 3: this worker writes new filings' facts, so it
      # invalidates the API's cached responses for them.
      CACHE_REDIS_URL: redis://redis-cache:6379
      # Its share of the SEC budget (see the top of this file).
      SEC_REQUESTS_PER_SECOND: "2"
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-scoring:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/scripts/scoringWorker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edgar_radar}
      REDIS_URL: redis://redis:6379
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-notification:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/scripts/notificationWorker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edgar_radar}
      REDIS_URL: redis://redis:6379
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL}
      # Optional: without a real Slack webhook, notificationWorker.ts's
      # existing behavior is to log the alert instead of sending it - not a
      # Docker-specific fallback, the same as running it on the host.
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- Phase 3 jobs, deployed in post-Phase 7, step 2 -----------------------
  # Each schedules itself with node-cron inside one long-running process, so
  # each is an ordinary always-on service here. Same image as the API.

  # Checks every company in the universe for new filings every 30 minutes and
  # enqueues each one as a `filing.discovered` job for worker-parser. Runs a
  # cycle on start too - cheap (one SEC request per company) and cursor-based,
  # so a restart never re-enqueues what an earlier cycle already found. With no
  # cursor yet, the first cycle looks back 24 hours (pollerRepository.ts).
  poller:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/scripts/poller.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edgar_radar}
      REDIS_URL: redis://redis:6379
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL}
      # Its share of the SEC budget (see the top of this file). 196 companies
      # at 2 per second is a cycle of about 100 seconds.
      SEC_REQUESTS_PER_SECOND: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Nightly at 02:00 (container time, UTC): cross-checks stored facts against
  # SEC's bulk companyfacts.zip (~1.4 GB, streamed to /app/.cache and deleted
  # afterwards) and corrects any that differ.
  reconcile:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/scripts/reconciliation.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edgar_radar}
      EDGAR_CONTACT_EMAIL: ${EDGAR_CONTACT_EMAIL}
      # It corrects facts, so it invalidates the API's cached responses.
      CACHE_REDIS_URL: redis://redis-cache:6379
      # One request a night, but a large one; its share of the SEC budget.
      SEC_REQUESTS_PER_SECOND: "1"
      # Every deploy restarts this container; without this, every deploy would
      # also download 1.4 GB. The nightly schedule is enough.
      RECONCILE_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Every 15 minutes: alerts if the poller has not completed a cycle in the
  # last ALERT_HEARTBEAT_THRESHOLD_MINUTES. Deliberately a separate process
  # from the poller - a dead poller cannot report its own death. With no Slack
  # webhook configured, alerts are logged instead of sent (src/alerting.ts).
  heartbeat:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/scripts/heartbeat.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edgar_radar}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_HEARTBEAT_THRESHOLD_MINUTES: ${ALERT_HEARTBEAT_THRESHOLD_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  pgdata-replica:
